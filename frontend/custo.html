<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>NexoGest - Custo</title>
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D4537E">
</head>
<body>
  <div class="produtos-container">
    <h1>Calculadora de custo</h1>
    <p class="subtitle">Monte a ficha técnica do produto para calcular o custo real.</p>

    <div class="form-produto">
      <h3>Cadastrar insumo</h3>
      <input type="text" id="nomeInsumo" placeholder="Nome (ex: Farinha de trigo)">
      <select id="unidadeInsumo">
        <option value="kg">Kg</option>
        <option value="litro">Litro</option>
        <option value="unidade">Unidade</option>
      </select>
      <input type="number" id="custoInsumo" placeholder="Custo por unidade" step="0.01">
      <button id="btnSalvarInsumo">Adicionar insumo</button>
    </div>

    <div class="form-produto">
      <h3>Montar ficha técnica</h3>
      <select id="selectProduto"></select>
      <select id="selectInsumo"></select>
      <input type="number" id="quantidadeUsada" placeholder="Quantidade usada" step="0.001">
      <button id="btnSalvarFicha">Adicionar à ficha técnica</button>
    </div>

    <h3>Custo do produto selecionado</h3>
    <div id="resultadoCusto" class="metrica-card"></div>
  </div>

  <script src="js/menu.js"></script>
  <script src="js/custo.js"></script>
</body>
</html>
