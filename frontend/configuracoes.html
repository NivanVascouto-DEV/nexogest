<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>NexoGest - Configurações</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D96C3F">
</head>
<body>
  <div class="produtos-container">
    <h1>Configurações</h1>

  <div class="form-produto">
    <h3>Aparência</h3>
    <label>Tema</label>
    <select id="temaSelect">
      <option value="claro">Claro</option>
      <option value="escuro">Escuro</option>
    </select>
    <label>Cor secundária</label>
    <input type="color" id="corSecundaria" value="#D96C3F">
  </div>

    <div class="form-produto">
      <h3>Impressão térmica</h3>
      <label>Largura do papel</label>
      <select id="larguraSelect">
        <option value="58">58mm</option>
        <option value="80">80mm</option>
      </select>
    </div>

    <div class="form-produto">
      <h3>Notificações</h3>
      <label class="checkbox-label">
        <input type="checkbox" id="somAtivo">
        Notificações sonoras
      </label>
      <label>Volume</label>
      <input type="range" id="volumeRange" min="0" max="100" value="70">
    </div>

    <button id="btnSalvarConfig">Salvar configurações</button>
  </div>

  <script src="js/menu.js"></script>
  <script src="js/configuracoes.js"></script>
</body>
</html>
