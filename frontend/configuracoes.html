<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>NexoGest - Configurações</title>
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D4537E">
</head>
<body>
  <div class="container-tela">
    <h1>Configurações</h1>

    <div class="form-cadastro">
      <h3>Aparência</h3>
      <label>Tema</label>
      <select id="temaSelect">
        <option value="claro">Claro</option>
        <option value="escuro">Escuro</option>
      </select>
      <label>Cor de destaque</label>
      <input type="color" id="corSecundaria" value="#D4537E">
    </div>

    <div class="form-cadastro">
      <h3>Impressão térmica</h3>
      <label>Largura do papel</label>
      <select id="larguraSelect">
        <option value="58">58mm</option>
        <option value="80">80mm</option>
      </select>
    </div>

    <div class="form-cadastro">
      <h3>Notificações</h3>
      <label class="checkbox-label">
        <input type="checkbox" id="somAtivo">
        Notificações sonoras
      </label>
      <label>Volume</label>
      <input type="range" id="volumeRange" min="0" max="100" value="70">
    </div>

    <button id="btnSalvarConfig">Salvar configurações</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/configuracoes.js"></script>
</body>
</html>
