<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>NexoGest - Financeiro</title>
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D4537E">
</head>
<body>
  <div class="container-tela">
    <h1>Financeiro</h1>

    <div class="metricas-grid" id="metricasDRE"></div>
    <div class="metricas-grid" id="metricasPagamento"></div>

    <div class="filtro-data">
      <input type="date" id="dataInicioFin">
      <span>até</span>
      <input type="date" id="dataFimFin">
      <button id="btnFiltrarFin">Filtrar</button>
    </div>

    <div class="form-cadastro">
      <h3>Nova despesa</h3>
      <input type="text" id="descricaoDespesa" placeholder="Descrição">
      <select id="categoriaDespesa">
        <option value="pessoal">Pessoal</option>
        <option value="administrativa">Administrativa</option>
        <option value="marketing">Marketing</option>
        <option value="tributos">Tributos</option>
        <option value="financeira">Financeira</option>
      </select>
      <input type="number" id="valorDespesa" placeholder="Valor" step="0.01">
      <select id="formaPagamentoDespesa">
        <option value="dinheiro">Dinheiro</option>
        <option value="pix">Pix</option>
        <option value="cartao">Cartão</option>
      </select>
      <label>Data de vencimento</label>
      <input type="date" id="vencimentoDespesa">
      <button id="btnSalvarDespesa">+ Lançamento</button>
    </div>

    <div class="tabela-wrapper">
      <table class="tabela">
        <thead>
          <tr><th>Descrição</th><th>Categoria</th><th>Vencimento</th><th>Valor</th><th>Ações</th></tr>
        </thead>
        <tbody id="corpoDespesas"></tbody>
      </table>
    </div>
  </div>

  <script src="js/menu.js"></script>
  <script src="js/financeiro.js"></script>
</body>
</html>
