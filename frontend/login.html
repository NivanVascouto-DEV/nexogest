<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>NexoGest - Login</title>
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D4537E">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo-quadrado" style="margin: 0 auto 14px;">
      <svg viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 2C8 2 5 6 5 10c0 2.5 1.2 4 2.5 5.3L8 24h10l0.5-8.7C19.8 14 21 12.5 21 10c0-4-3-8-8-8z" fill="#fff" fill-opacity="0.95"/><path d="M9 10.5c0-2.2 1.8-4 4-4s4 1.8 4 4" stroke="#D4537E" stroke-width="1.3" stroke-linecap="round" fill="none"/><circle cx="13" cy="10.5" r="1.4" fill="#D4537E"/></svg>
    </div>
    <h1>NexoGest</h1>
    <p class="subtitle">Entre para continuar</p>

    <label for="login">Login</label>
    <input type="text" id="login" placeholder="admin">

    <label for="senha">Senha</label>
    <input type="password" id="senha" placeholder="••••••••">

    <button id="btnEntrar">Entrar</button>

    <p id="mensagemErro" class="erro"></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
