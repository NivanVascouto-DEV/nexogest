<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>NexoGest - Pedidos</title>
  <link rel="stylesheet" href="css/style.css?v=4">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D4537E">
</head>
<body>
  <div class="container-tela">
    <h1>Pedidos</h1>

    <div class="stats-grid" id="statsPedidos"></div>

    <div class="abas">
      <button class="aba-btn" data-status="pendente">Pendentes <span class="aba-contador" data-contador="pendente">0</span></button>
      <button class="aba-btn" data-status="preparando">Preparo <span class="aba-contador" data-contador="preparando">0</span></button>
      <button class="aba-btn" data-status="saiu_para_entrega">Prontos <span class="aba-contador" data-contador="saiu_para_entrega">0</span></button>
      <button class="aba-btn" data-status="entregue">Entregues <span class="aba-contador" data-contador="entregue">0</span></button>
    </div>

    <div id="listaPedidos"></div>
  </div>

  <div class="atalhos-legenda">
    <span><kbd>A</kbd> Avançar</span>
    <span class="atalho-restrito"><kbd>C</kbd> Cozinha</span>
    <span class="atalho-restrito"><kbd>L</kbd> Cliente</span>
    <span class="atalho-restrito"><kbd>X</kbd> Cancelar</span>
    <span class="atalhos-legenda-obs">— passe o mouse sobre um pedido</span>
  </div>

  <script src="js/config.js"></script>
  <script src="js/socket.io.min.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/pedidos.js"></script>
</body>
</html>
