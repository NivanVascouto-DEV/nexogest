<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>NexoGest - Produtos</title>
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D4537E">
</head>
<body>
  <div class="container-tela">
    <h1>Produtos</h1>

    <div class="form-cadastro">
      <h3>Novo produto</h3>
      <input type="text" id="nomeProduto" placeholder="Nome do produto">
      <input type="number" id="precoProduto" placeholder="Preço" step="0.01">
      <input type="number" id="codigoProduto" placeholder="Código">
      <select id="canalVenda">
        <option value="convencional">Convencional</option>
        <option value="delivery">Delivery</option>
      </select>
      <select id="unidadeVenda">
        <option value="unidade">Unidade</option>
        <option value="kg">Kg</option>
        <option value="pacote">Pacote</option>
      </select>
      <label class="checkbox-label">
        <input type="checkbox" id="controlaEstoque">
        Controla estoque
      </label>
      <button id="btnSalvarProduto">Adicionar produto</button>
    </div>

    <div class="busca-caixa">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
      <input type="text" id="buscaProduto" placeholder="Buscar produto">
    </div>

    <div class="tabela-wrapper">
      <table class="tabela">
        <thead>
          <tr><th>Código</th><th>Nome</th><th>Unidade</th><th>Preço</th><th>Ações</th></tr>
        </thead>
        <tbody id="corpoProdutos"></tbody>
      </table>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/produtos.js"></script>
</body>
</html>
