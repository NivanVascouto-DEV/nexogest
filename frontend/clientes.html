<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>NexoGest - Clientes</title>
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D4537E">
</head>
<body>
  <div class="container-tela">
    <h1>Clientes</h1>
    <p class="subtitle">Cadastre manualmente ou deixe que a tela de Venda cadastre automaticamente.</p>

    <div class="form-cadastro">
      <h3>Novo cliente</h3>
      <input type="text" id="nomeCliente" placeholder="Nome">
      <input type="text" id="telefoneCliente" placeholder="Telefone">
      <input type="text" id="enderecoCliente" placeholder="Endereço">
      <button id="btnSalvarCliente">Adicionar cliente</button>
    </div>

    <div class="tabela-wrapper">
      <table class="tabela">
        <thead>
          <tr><th>Nome</th><th>Telefone</th><th>Ações</th></tr>
        </thead>
        <tbody id="corpoClientes"></tbody>
      </table>
    </div>
  </div>

  <script src="js/menu.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>
