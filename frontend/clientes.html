<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>NexoGest - Clientes</title>
  <link rel="stylesheet" href="css/style.css?v=4">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D4537E">
</head>
<body>
  <div class="container-tela">
    <h1>Clientes</h1>
    <p class="subtitle">Cadastre manualmente ou deixe que a tela de Venda cadastre automaticamente.</p>

    <div class="form-cadastro">
      <h3>Novo cliente</h3>
      <input type="text" id="nomeCliente" placeholder="Nome">
      <input type="text" id="telefoneCliente" placeholder="Telefone">
      <input type="text" id="enderecoCliente" placeholder="Endereço">
      <button id="btnSalvarCliente">Adicionar cliente</button>
    </div>

    <div class="busca-caixa">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
      <input type="text" id="buscaCliente" placeholder="Buscar por nome ou telefone">
    </div>

    <div id="gradeClientes" class="grade-clientes"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>
